<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SwiftMart AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0a0e1a;
    color: #e6edf3;
  }
  body { display: flex; flex-direction: column; }

  /* --- Lock screen --- */
  #lock {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at top, #0d47a1 0%, #0a0e1a 70%);
    z-index: 100;
    padding: 20px;
  }
  .lockCard {
    background: #0d1220;
    border: 1px solid #1a2332;
    padding: 32px 24px;
    border-radius: 18px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    text-align: center;
  }
  .lockIcon { font-size: 40px; margin-bottom: 12px; }
  .lockCard h1 { font-size: 22px; margin-bottom: 6px; font-weight: 600; }
  .lockCard p { color: #7a8ba8; font-size: 13px; margin-bottom: 22px; }
  #pwInput {
    width: 100%;
    background: #161d2d;
    border: 1px solid #232c40;
    color: #e6edf3;
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 15px;
    outline: none;
    margin-bottom: 12px;
  }
  #pwInput:focus { border-color: #1e88e5; }
  #unlockBtn {
    width: 100%;
    background: #1e88e5;
    color: white;
    border: none;
    padding: 14px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  #unlockBtn:hover { background: #1976d2; }
  #unlockBtn:disabled { opacity: 0.6; cursor: not-allowed; }
  #pwError {
    color: #ff9c9c;
    font-size: 13px;
    margin-top: 12px;
    min-height: 18px;
  }

  /* --- App --- */
  #app { display: none; flex-direction: column; height: 100%; }

  header {
    padding: 16px 20px;
    background: linear-gradient(135deg, #0d47a1 0%, #1e88e5 100%);
    border-bottom: 1px solid #1a2332;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.4);
  }
  .logo {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .title { font-weight: 600; font-size: 17px; letter-spacing: 0.3px; }
  .subtitle { font-size: 12px; opacity: 0.75; margin-top: 2px; }
  .status {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #4caf50;
    margin-left: auto;
    box-shadow: 0 0 8px #4caf50;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }
  .msg {
    max-width: 85%;
    padding: 12px 16px;
    border-radius: 16px;
    line-height: 1.5;
    font-size: 15px;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: fadeIn 0.25s ease;
  }
  @keyframes fadeIn { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }
  .msg.user { align-self: flex-end; background: #1e88e5; color: #fff; border-bottom-right-radius: 4px; }
  .msg.ai { align-self: flex-start; background: #161d2d; border: 1px solid #232c40; border-bottom-left-radius: 4px; }
  .msg.error { align-self: flex-start; background: #3a1414; border: 1px solid #7a2626; color: #ff9c9c; }
  .typing {
    align-self: flex-start;
    background: #161d2d;
    border: 1px solid #232c40;
    padding: 14px 18px;
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    display: flex; gap: 5px;
  }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: #5b7db8;
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:0.5;} 30%{transform:translateY(-6px);opacity:1;} }

  #inputBar {
    padding: 12px 14px;
    background: #0d1220;
    border-top: 1px solid #1a2332;
    display: flex; gap: 10px; align-items: flex-end;
  }
  #input {
    flex: 1;
    background: #161d2d;
    border: 1px solid #232c40;
    color: #e6edf3;
    padding: 12px 16px;
    border-radius: 22px;
    font-size: 15px;
    outline: none;
    resize: none;
    max-height: 120px;
    font-family: inherit;
  }
  #input:focus { border-color: #1e88e5; }
  #send {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: #1e88e5;
    border: none;
    color: white;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  #send:hover { background: #1976d2; }
  #send:disabled { background: #2a3550; cursor: not-allowed; opacity: 0.6; }

  .welcome { text-align: center; padding: 40px 20px; color: #7a8ba8; font-size: 14px; line-height: 1.7; }
  .welcome h2 { color: #e6edf3; font-size: 20px; margin-bottom: 8px; font-weight: 600; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 22px; }
  .suggestion {
    background: #161d2d; border: 1px solid #232c40; color: #b8c6e0;
    padding: 9px 14px; border-radius: 20px; font-size: 13px; cursor: pointer;
    transition: all 0.15s;
  }
  .suggestion:hover { border-color: #1e88e5; color: #e6edf3; background: #1a2540; }

  #chat::-webkit-scrollbar { width: 6px; }
  #chat::-webkit-scrollbar-thumb { background: #232c40; border-radius: 3px; }
</style>
</head>
<body>

<!-- Lock screen -->
<div id="lock">
  <div class="lockCard">
    <div class="lockIcon">🔒</div>
    <h1>SwiftMart AI</h1>
    <p>Admin access only</p>
    <input id="pwInput" type="password" placeholder="Enter admin password" autocomplete="current-password">
    <button id="unlockBtn">Unlock</button>
    <div id="pwError"></div>
  </div>
</div>

<!-- Main app -->
<div id="app">
  <header>
    <div class="logo">🛒</div>
    <div>
      <div class="title">SwiftMart AI</div>
      <div class="subtitle">Marketplace & Fintech Assistant</div>
    </div>
    <div class="status"></div>
  </header>

  <div id="chat">
    <div class="welcome">
      <h2>Welcome back 👋</h2>
      <p>Ask me anything about SwiftMart.</p>
      <div class="suggestions">
        <div class="suggestion" data-q="How is SwiftMart doing today?">📊 Today's summary</div>
        <div class="suggestion" data-q="Any suspicious transactions I should worry about?">🚨 Fraud check</div>
        <div class="suggestion" data-q="Show me our vendors">👥 Our vendors</div>
        <div class="suggestion" data-q="How much have we sold this month?">💰 Monthly sales</div>
      </div>
    </div>
  </div>

  <div id="inputBar">
    <textarea id="input" placeholder="Ask SwiftMart AI..." rows="1"></textarea>
    <button id="send">➤</button>
  </div>
</div>

<script>
const lockEl = document.getElementById('lock');
const appEl = document.getElementById('app');
const pwInput = document.getElementById('pwInput');
const unlockBtn = document.getElementById('unlockBtn');
const pwError = document.getElementById('pwError');
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendEl = document.getElementById('send');

let adminPassword = sessionStorage.getItem('swiftmart_pw') || '';
let history = [];
let busy = false;

// ---------- Unlock flow ----------
async function tryUnlock() {
  const pw = pwInput.value;
  if (!pw) return;
  unlockBtn.disabled = true;
  unlockBtn.textContent = 'Checking...';
  pwError.textContent = '';

  try {
    const res = await fetch('/api/swiftmart/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ adminPassword: pw })
    });
    const data = await res.json();

    if (data.ok) {
      adminPassword = pw;
      sessionStorage.setItem('swiftmart_pw', pw);
      lockEl.style.display = 'none';
      appEl.style.display = 'flex';
      inputEl.focus();
    } else {
      pwError.textContent = data.error || 'Wrong password';
      pwInput.value = '';
    }
  } catch (e) {
    pwError.textContent = 'Connection error';
  }
  unlockBtn.disabled = false;
  unlockBtn.textContent = 'Unlock';
}

unlockBtn.addEventListener('click', tryUnlock);
pwInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryUnlock(); });

// Auto-unlock if password already in this session
if (adminPassword) {
  pwInput.value = adminPassword;
  tryUnlock();
}

// ---------- Chat flow ----------
function autoResize() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
}
function scrollBottom() {
  setTimeout(() => chatEl.scrollTo({ top: chatEl.scrollHeight, behavior: 'smooth' }), 40);
}
function addMessage(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  chatEl.appendChild(div);
  scrollBottom();
}
function showTyping() {
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typing';
  div.innerHTML = '<span></span><span></span><span></span>';
  chatEl.appendChild(div);
  scrollBottom();
}
function hideTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

async function sendMessage(text) {
  if (!text.trim() || busy) return;
  busy = true;
  sendEl.disabled = true;
  inputEl.value = '';
  autoResize();

  const welcome = chatEl.querySelector('.welcome');
  if (welcome) welcome.remove();

  addMessage(text, 'user');
  showTyping();

  try {
    const res = await fetch('/api/swiftmart/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history, adminPassword })
    });
    const data = await res.json();
    hideTyping();

    if (res.status === 401) {
      // Password no longer valid — force re-login
      sessionStorage.removeItem('swiftmart_pw');
      alert('Session expired. Please unlock again.');
      location.reload();
      return;
    }

    if (data.error) {
      addMessage('⚠ ' + data.error, 'error');
    } else {
      addMessage(data.reply, 'ai');
      history.push({ role: 'user', content: text });
      history.push({ role: 'assistant', content: data.reply });
      if (history.length > 20) history = history.slice(-20);
    }
  } catch (e) {
    hideTyping();
    addMessage('⚠ Connection error: ' + e.message, 'error');
  }

  busy = false;
  sendEl.disabled = false;
  inputEl.focus();
}

sendEl.addEventListener('click', () => sendMessage(inputEl.value));
inputEl.addEventListener('input', autoResize);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage(inputEl.value);
  }
});
document.querySelectorAll('.suggestion').forEach(el => {
  el.addEventListener('click', () => sendMessage(el.dataset.q));
});
</script>
</body>
</html>
